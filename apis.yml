aid: trycardinal-ai
name: Cardinal
description: 'Cardinal is an AI platform for precision outbound sales — it markets
  itself as "revenue agents for high-growth companies" — built for go-to-market teams
  that want outbound to run as one engine instead of a stack of disconnected tools.
  Its agents build and refresh account lists from signals, monitor what prospects post
  and engage with, generate personalized snippets, and orchestrate end-to-end email
  and LinkedIn plays, while capturing inbound from website visitors, product signups
  and ad impressions. The company is a Y Combinator Winter 2026 company founded by
  Devishi Jha and Jianna Liu, based in San Francisco, and names Mintlify, Deepgram,
  Greptile, Giga and Luminai among its customers. Cardinal moved its primary web
  presence from trycardinal.ai to trycardinal.com during 2026: https://trycardinal.ai/
  now HTTP 301s to https://www.trycardinal.com/ and the former deep pages on the .ai
  domain (/company, /product) return 404, though the company still runs its customer
  application, its email and its analytics identity on trycardinal.ai. The product is
  sold as half-software and half-service ("we wire into your existing stack and build
  agents around plays that already work for you"), delivered through a customer app at
  app.trycardinal.ai behind a Stytch login, with a Calendly GTM chat as the only
  publicly reachable entry point. It reads from and writes back to customer CRMs and
  says it adds a new integration every two weeks, but names none of them publicly and
  publishes no outbound API of its own: across four hosts on two domains this pass
  found no OpenAPI, GraphQL SDL, AsyncAPI, MCP server, agent card, webhook catalog,
  SDK, CLI, developer portal or documentation site. docs.trycardinal.ai does not
  resolve in DNS, api.trycardinal.ai is a dangling custom domain whose Render origin
  answers x-render-routing: no-server, and every /api/* path on the customer app
  returns HTTP 401 {"error":"Unauthorized"}.'

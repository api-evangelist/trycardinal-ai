    status: 404
  - path: /.well-known/agent.json
    status: 404
  - path: /.well-known/mcp.json
    status: 404

- host: https://trycardinal.ai
  role: legacy marketing domain (root 301s to www.trycardinal.com)
  control_probe:
    path: /.well-known/zzz-control-nonexistent-9931
    status: 404
    bytes: 10
    note: host returns honest 404s ("Not Found"); every status below is trustworthy
  documents:
  - path: /.well-known/security.txt
    status: 404
  - path: /.well-known/openid-configuration
    status: 404
  - path: /.well-known/oauth-authorization-server
    status: 404
  - path: /.well-known/oauth-protected-resource
    status: 404
  - path: /.well-known/api-catalog
    status: 404
  - path: /.well-known/ai-plugin.json
    status: 404
  - path: /.well-known/agent-card.json
    status: 404
  - path: /.well-known/agent.json
    status: 404
  - path: /.well-known/mcp.json
    status: 404

- host: https://app.trycardinal.ai
  role: customer application (Next.js on Vercel, Stytch login)
  control_probe:
    path: /.well-known/zzz-control-nonexistent-9931
    status: 307
    location: /login?next=...
    note: >-
      NOT a soft-200 catch-all. Extensionless paths are caught by auth middleware and
      307 to the login page; paths ending in a file extension fall through to an honest
      Next.js 404. Either way nothing anonymous is readable, and no 200 is recorded on
      this host — there is no false-positive risk here.
  documents:
  - path: /.well-known/security.txt
    status: 307
    document: false
    redirects_to: /login
  - path: /.well-known/openid-configuration
    status: 307
    document: false
    redirects_to: /login
  - path: /.well-known/oauth-authorization-server
    status: 307
    document: false
    redirects_to: /login
    note: >-
      Auth-gated, not published. Cardinal's application authenticates against Stytch
      (api.stytch.com appears in the app's own Content-Security-Policy connect-src), so
      any OAuth metadata would belong to Stytch rather than to Cardinal.
  - path: /.well-known/oauth-protected-resource
    status: 307
    document: false
    redirects_to: /login
  - path: /.well-known/api-catalog
    status: 307
    document: false
    redirects_to: /login
  - path: /.well-known/ai-plugin.json
    status: 404
    document: false
  - path: /.well-known/agent-card.json
    status: 404
    document: false
  - path: /.well-known/agent.json
    status: 404
    document: false
  - path: /.well-known/mcp.json
    status: 404
    document: false


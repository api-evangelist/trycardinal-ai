generated: '2026-08-13'
method: probed
source: >-
  Live unauthenticated GET of the RFC 8615 /.well-known/ discovery surface on every
  reachable host Cardinal operates: the current marketing site (www.trycardinal.com),
  the legacy marketing domain (trycardinal.ai) and the customer application
  (app.trycardinal.ai). apis.yml carries no apis[] entries and no baseURL, so the host
  list was assembled from the website, the redirect target and the application host.
checked: '2026-08-13'

# POINTER DECISION — no WellKnown and no SecurityTxt pointer is emitted from this file.
# Thirty probes across three hosts returned ZERO documents. Every path either 404s or
# 307s to a login. A pointer asserts that the provider SERVES that surface; this file
# records that it does not. Recording the absence is the point — a later pass should
# not have to re-litigate it.
#
# api.trycardinal.ai is deliberately absent from the host list below: it presents no TLS
# certificate (SSLV3_ALERT_HANDSHAKE_FAILURE) and its Render origin answers
# x-render-routing:no-server, so there is no server there to probe. See
# security/trycardinal-ai-domain-security.yml.

hosts:
- host: https://www.trycardinal.com
  role: marketing website (Framer-hosted)
  control_probe:
    path: /.well-known/zzz-control-nonexistent-9931
    status: 404
    bytes: 10
    note: host returns honest 404s ("Not found"); every status below is trustworthy
  documents:
  - path: /.well-known/security.txt
    status: 404
  - path: /.well-known/openid-configuration
    status: 404
  - path: /.well-known/oauth-authorization-server
    status: 404
